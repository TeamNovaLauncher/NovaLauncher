name: Nova Launcher APK

on:
  push:
    branches: [v3_openjdk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get LTW
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          cd app_pojavlauncher/libs
          wget https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build
        run: |
          bash scripts/languagelist_updater.sh
          mkdir -p out
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          cp app_pojavlauncher/build/outputs/apk/debug/*.apk out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaLauncher-APK
          path: out/*.apk
          if-no-files-found: error
